<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abraxas – Importer</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="topbar"><a class="brand" href="/">Abraxas</a><nav><a href="/">Sessions</a><a href="/upload" aria-current="page">Importer</a></nav></header>
<main class="narrow">
  <h1>Importer la base de données</h1>
  <p class="lead">Envoie le fichier téléchargé depuis le Raspberry (abraxas_….db). Les sessions déjà présentes ne sont pas dupliquées.</p>
  <div id="notice" class="notice error" hidden></div>
  <form id="form" class="upload">
    <label>Fichier de la base
      <input id="file" type="file" accept=".db,.sqlite,.sqlite3,application/octet-stream" required>
    </label>
    <label>Code d'accès
      <input id="code" type="password" autocomplete="current-password" required>
    </label>
    <label class="inline"><input id="remember" type="checkbox" checked> Retenir le code sur cet appareil</label>
    <button id="send" type="submit">Envoyer</button>
    <progress id="progress" value="0" max="1" hidden></progress>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <ul id="results" class="result-list"></ul>
</main>
<script type="module" src="/js/upload.js"></script>
</body>
</html>
